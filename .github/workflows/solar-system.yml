name: Solar System Workflow

on:
      workflow_dispatch:
      push:
        branches:
            - main
            - 'feature/*'

env:
    MONGO_URI: ${{ vars.MONGO_URI }}
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
      strategy:
        matrix:
          nodejs_version: [18, 19, 20]
          operating_system: [ubuntu-latest, macos-latest]
          exclude:
          - nodejs_version: 18
            operating_system: macos-latest
      name: Unit Testing
      runs-on: ${{ matrix.operating_system }}
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - 18
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      # using a custom (composite) action below, instead of the two steps cache and install dependencies
      - name: Composite Action - Cache & Install NPM Packages
        uses: ./.github/custom-actions/npm-action/action.yml
        with:
          path-of-folder: node_modules

      - name: Unit Testing
        id: nodejs-testing
        run: npm test

      - name: Archive Test Result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mocha-Test-Result-${{ matrix.operating_system }}.${{ matrix.nodejs_version }}
          path: test-results.xml

  code-coverage:
      name: Code Coverage
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4		# checkout the repo

      - name: Setup NodeJS Version - 18
        uses: actions/setup-node@v3	# needed since the app uses NodeJS
        with:
          node-version: 18		# installs version 18

      # using a custom (composite) action below, instead of the two steps cache and install dependencies
      - name: Composite Action - Cache & Install NPM Packages
        uses: ./.github/custom-actions/npm-action/action.yml
        with:
          path-of-folder: node_modules

      - name: Check Code Coverage
        run: npm run coverage			# run code coverage
        continue-on-error: true

      - name: Archive Code Coverage Result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

  reports-s3:
      needs: [code-coverage, unit-testing]
      name: AWS S3 - Upload Reports
      runs-on: ubuntu-latest
      continue-on-error: true
      steps:
        - name: Download Mocha Test Artifact
          uses: actions/download-artifact@v3
          with:
            name: Mocha-Test-Result

        - name: Download Code Coverage Artifact
          uses: actions/download-artifact@v3
          with:
            name: Code-Coverage-Result
        
        - name: Merge Test Files
          run: |
            ls -ltr
            mkdir reports-${{ github.sha }}
            mv cobertura-coverage.xml reports-${{ github.sha }}
            mv test-results.xml reports-${{ github.sha }}
            ls -ltr reports-${{ github.sha }}

        - name: Upload to AWS S3
          uses: jakejarvis/s3-sync-action@master
          with:
            args: --acl public-read --follow-symlinks --delete
          env:
            AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: 'us-west-1'   # optional: defaults to us-east-1
            SOURCE_DIR: 'reports-${{ github.sha }}'
            DEST_DIR: 'reports-${{ github.sha }}'

  docker:
      permissions: write-all
      name: Containerization
      needs: [unit-testing, code-coverage]
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Dockerhub Login
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }} 

      # above tags image with sha of the commit, keep in mind the image is
      # built with the tag but not pushed to registry.  It is is in the 
      # local docker engine though!
      - name: GHCR Login
        uses: docker/login-action@v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      # github.repository_owner is already a premade variable in the github context
      # secrets.GITHUB_TOKEN is automatically created for each workflow job

      - name: Docker Build and Tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}


      # below runs the docker image that was built in the previous step
      - name: Docker Image Test
        run: |
          docker images
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          
          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Docker Push to docker hub AND github container registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  # dev stuff should only be triggered from the feature branch
  dev-deploy:
      if: contains(github.ref, 'feature/')
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml
      with:
        mongodb-uri: ${{ env.MONGO_URI }}
        k8s-manifest-dir: kubernetes/development/
        environment: development
      secrets:  
      # the names below must match the names from the called (reusable) workflow,
      # the values below would match the secret names in the repo, so the caller workflow (this) passes it into the 
      # called workflow (reusable)
        k8s-kubeconfig: ${{ secrets.KUBECONFIG }}
        mongodb-password: ${{ secrets.MONGO_PASSWORD }}
        

  dev-integration-testing:
    if: contains(github.ref, 'feature/')
    name: Dev integration testing
    runs-on: ubuntu-latest
    needs: dev-deploy
    steps:
    - name: Test URL Output using CURL and JQ
      env:
        URL: ${{ needs.dev-deploy.outputs.application-url }}
      run: |
        echo $URL
        echo "---------------------------------"
        curl https://$URL/live -s -k | jq -r .status | grep -i live

  # This will only work if triggered from main branch!  (because it is in a rule for the production environment)
  prod-deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    uses: ./.github/workflows/reuse-deployment.yml
    with:
      mongodb-uri: ${{ vars.MONGO_URI }}
      k8s-manifest-dir: kubernetes/production/
      environment: production
    secrets:  
    # the names below must match the names from the called (reusable) workflow,
    # the values below would match the secret names in the repo, so the caller workflow (this) passes it into the 
    # called workflow (reusable)
      k8s-kubeconfig: ${{ secrets.KUBECONFIG }}
      mongodb-password: ${{ secrets.MONGO_PASSWORD }}

  prod-integration-testing:
    name: Prod integration testing
    runs-on: ubuntu-latest
    needs: prod-deploy
    steps:
    - name: Test URL Output using CURL and JQ
      env:
        URL: ${{ needs.prod-deploy.outputs.application-url }}
      run: |
        echo $URL
        echo "---------------------------------"
        curl https://$URL/live -s -k | jq -r .status | grep -i live

  slack-notification:
    if: always()
    name: Slack Notification
    needs: [dev-integration-testing, prod-integration-testing]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: github-actions-channel #does not exist need to make this
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'good' or '#ff00ff'
          SLACK_ICON: https://github.com/rtCamp.png?size=48 #can use your own
          SLACK_MESSAGE: ':hammer_and_wrench' Triggered by ${{ github.actor }}
          SLACK_TITLE: Information
